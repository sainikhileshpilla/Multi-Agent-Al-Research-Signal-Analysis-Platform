[project]
name = "source_code"
version = "0.1.0"
description = "source_code using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.9.3",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "feedparser>=6.0",
]

[project.scripts]
source_code = "source_code.main:run"
run_crew = "source_code.main:run"
train = "source_code.main:train"
replay = "source_code.main:replay"
test = "source_code.main:test"
run_with_trigger = "source_code.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["source_code"]

[tool.crewai]
type = "crew"
