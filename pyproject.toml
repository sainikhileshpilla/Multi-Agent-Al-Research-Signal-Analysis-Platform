[project]
name = "source_code"
version = "0.1.0"
description = "source_code using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.9.3",
    "fastapi>=0.115",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "feedparser>=6.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.30",
    "chromadb>=0.5",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.23",
]

[project.scripts]
source_code = "source_code.main:run"
run_crew = "source_code.main:run"
api = "source_code.api:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["source_code", "services", "apps"]

[tool.crewai]
type = "crew"
