[project]
name = "first_project"
version = "0.1.0"
description = "First_Project using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.9.3",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "feedparser>=6.0",
]

[project.scripts]
first_project = "first_project.main:run"
run_crew = "first_project.main:run"
train = "first_project.main:train"
replay = "first_project.main:replay"
test = "first_project.main:test"
run_with_trigger = "first_project.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["first_project"]

[tool.crewai]
type = "crew"
