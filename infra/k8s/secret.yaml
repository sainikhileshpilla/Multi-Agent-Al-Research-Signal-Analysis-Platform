# Secret for sensitive data (e.g., OpenAI API key)
#
# IMPORTANT: This is a TEMPLATE. You MUST replace the placeholder value with
# your actual OpenAI API key, encoded in base64.
#
# To create a valid secret from your key:
#   echo -n "sk-your-actual-key-here" | base64
#   # Copy the output and paste it below in place of <BASE64_ENCODED_KEY>
#
# Alternative: skip this file and create the secret via kubectl:
#   kubectl create secret generic ai-signal-secrets \
#     --from-literal=OPENAI_API_KEY=sk-your-key \
#     -n ai-signal
#
apiVersion: v1
kind: Secret
metadata:
  name: ai-signal-secrets
  namespace: ai-signal
type: Opaque
data:
  # REPLACE THIS VALUE with your base64-encoded OpenAI key
  # If you don't have an OpenAI key, leave it empty and the platform will
  # use the built-in all-MiniLM-L6-v2 embedding model (free, local).
  OPENAI_API_KEY: ""  # echo -n "sk-..." | base64 → paste result here
