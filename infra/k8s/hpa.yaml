# Horizontal Pod Autoscaler
#
# Automatically scales the deployment based on CPU usage:
#   • Scales up if average CPU > 80%
#   • Scales down if average CPU < 80%
#   • Min 2 pods (for high availability)
#   • Max 5 pods (cost control)
#
# Requires metrics-server to be installed in the cluster:
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-signal-api-hpa
  namespace: ai-signal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-signal-api

  minReplicas: 2
  maxReplicas: 5

  metrics:
    # Scale based on CPU utilization
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80  # Target 80% CPU usage

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 min before scaling down
      policies:
        - type: Percent
          value: 50                     # Max 50% reduction per scaling event
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0    # Scale up immediately
      policies:
        - type: Percent
          value: 100                    # Max double the replicas per scaling event
          periodSeconds: 60
